# =====================================================================
# Apollo Portal 配置内容（直接按行粘贴到 Portal 后发布）
#   应用：hint-gateway（或你在 Apollo 中为网关创建的 appId，需与 APOLLO_APP_ID 一致）
#   命名空间：application
#   格式：properties
# 修改保存并发布后，网关实时生效（ApolloGrayHintRefresher 原地重绑定），无需重启。
# 列表类配置用英文逗号分隔。
# =====================================================================

# 是否启用基于柜员身份的灰度打标（GrayHintFilter）
gray.hint.enabled=true

# 试点泳道标记值，与试点实例 Eureka metadata 的 hint 一致
gray.hint.lane=trial

# 配置了灰度角色的柜员，其所有操作走试点（角色编码，多个用英文逗号分隔）
gray.hint.roles=GRAY_TRIAL

# 按柜员号直接配置的灰度名单（临时试点/兜底，多个用英文逗号分隔）
gray.hint.tellers=8888
