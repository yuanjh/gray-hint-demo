# 新增文件：按登录柜员身份（柜员号/角色）打标的灰度配置，替代原 application.yml 的 Query=flag 方式。
# 使用方法（不改动任何原文件）：
#   java -jar gateway/target/gateway.jar --spring.config.name=application-gray \
#        --server.port=19080 --demo.lane=main
# 注意：请用 --spring.config.name=application-gray 而不是 --spring.profiles.active=gray，
# 后者会与原 application.yml 合并加载，路由列表按下标合并会导致新旧规则混在一起。
server:
  port: 19080
spring:
  application:
    name: hint-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 打标不再看 URL 参数：所有请求走同一条路由，
            # 灰度 Hint 由 GrayHintFilter 按登录柜员身份（柜员号/角色）决定。
            - id: demo
              uri: lb://hint-service-a
              predicates:
                - Path=/api/demo
          # 放行 readme.html 按钮演示的跨域请求（页面 file:// 直接调用网关）。
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origin-patterns: "*"
                allowed-headers: "*"
                allowed-methods: "*"
    loadbalancer:
      cache:
        enabled: false
      hint-header-name: X-SC-LB-Hint
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:18761/eureka/}
    registry-fetch-interval-seconds: 3
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${demo.lane:shared}:${server.port}
    lease-renewal-interval-in-seconds: 3
management:
  endpoints:
    web:
      exposure:
        include: health,info
# ---- Apollo 配置中心 ----
# 灰度名单以 Apollo 为准（application 命名空间，键见根目录 apollo-gray-hint.properties），
# 本地 gray.hint.* 仅作缺省值/离线兜底；Apollo 修改后由 ApolloGrayHintRefresher 实时重绑定。
# 本地演示不开 Apollo（APOLLO_ENABLED 缺省 false）；接入 Apollo 时置 true 并配置 APOLLO_APP_ID/APOLLO_META。
app:
  id: ${APOLLO_APP_ID:hint-gateway}
apollo:
  meta: ${APOLLO_META:http://localhost:8080}
  cache-dir: ${APOLLO_CACHE_DIR:/opt/data/apollo-config}
  bootstrap:
    enabled: ${APOLLO_ENABLED:false}
    namespaces: application
    eager-load:
      enabled: true
# 灰度名单缺省值（Apollo 未配置或离线时生效），生产建议只在 Apollo 维护。
gray:
  hint:
    enabled: true      # 打开 GrayHintFilter；原 application.yml 未配置该项，过滤器不加载
    lane: trial        # 试点泳道标记值，与试点实例 metadata 的 hint 一致
    roles:             # 配置了灰度角色的柜员，其所有操作走试点
      - GRAY_TRIAL
    tellers:           # 按柜员号直接配置的灰度名单（临时试点/兜底）
      - "8888"
